name: Code scorecard integration
on:
  pull_request:
    paths: ['skills/code-scorecard/**', '.github/workflows/code-scorecard-integration.yml']
  push:
    branches: [main]
    paths: ['skills/code-scorecard/**', '.github/workflows/code-scorecard-integration.yml']
  workflow_dispatch:
    inputs:
      migration_ref:
        description: 'Optional published Git commit matching compatibility.localMigration.revision'
        required: false
        type: string
permissions:
  contents: read
jobs:
  packaged-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify behavioral evaluation harness
        run: node --test skills/code-scorecard/evals/run.test.mjs
      - id: contract
        shell: pwsh
        run: |
          $contract = Get-Content skills/code-scorecard/compatibility.json | ConvertFrom-Json
          "revision=$($contract.source.revision)" >> $env:GITHUB_OUTPUT
          "repository=$($contract.source.repository)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.contract.outputs.repository }}
          ref: ${{ steps.contract.outputs.revision }}
          path: contract-source
      - name: Package the pinned analyzers
        shell: pwsh
        run: |
          dotnet pack contract-source/analyzers/dotnet/src/CodeMetrics.AI/CodeMetrics.AI.csproj -c Release -o packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix contract-source/analyzers/javascript-typescript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location contract-source/analyzers/javascript-typescript
          npm pack --pack-destination ../../../packages
          Pop-Location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged integration
        shell: pwsh
        run: |
          $env:SCORECARD_NPM_PACKAGE = (Get-Item packages/*.tgz).FullName
          $env:SCORECARD_DOTNET_PACKAGE = (Get-Item packages/*.nupkg).FullName
          node --test skills/code-scorecard/scripts/tests/runtime.test.mjs skills/code-scorecard/scripts/tests/package-selection.test.mjs skills/code-scorecard/scripts/tests/rule-catalog.test.mjs skills/code-scorecard/scripts/tests/integration.test.mjs
          exit $LASTEXITCODE
      - name: Install authored coverage fixture dependency
        run: python -m pip install coverage==7.6.1
      - name: Verify Python preview from the pinned source
        shell: pwsh
        run: |
          if (!(Test-Path contract-source/analyzers/javascript-typescript/src/python-cli.ts)) { throw 'The pinned preview must include the Python CLI.' }
          $env:SCORECARD_NPM_PACKAGE = (Get-Item packages/*.tgz).FullName
          node --test skills/code-scorecard/scripts/tests/python.test.mjs
          exit $LASTEXITCODE
      - name: Validate optional migration revision
        if: inputs.migration_ref != ''
        shell: pwsh
        env:
          MIGRATION_REF: ${{ inputs.migration_ref }}
        run: |
          $contract = Get-Content skills/code-scorecard/compatibility.json | ConvertFrom-Json
          if ($env:MIGRATION_REF -ne $contract.localMigration.revision) { throw 'Use the exact tested localMigration revision.' }
      - uses: actions/checkout@v4
        if: inputs.migration_ref != ''
        with:
          repository: ${{ steps.contract.outputs.repository }}
          ref: ${{ inputs.migration_ref }}
          path: migration-source
      - name: Package and verify both brands
        if: inputs.migration_ref != ''
        shell: pwsh
        run: |
          dotnet pack migration-source/analyzers/dotnet/src/CodeMetrics.AI/CodeMetrics.AI.csproj -c Release -o migration-packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix migration-source/analyzers/javascript-typescript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location migration-source/analyzers/javascript-typescript
          npm pack --pack-destination ../../../migration-packages
          Pop-Location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SCORECARD_NPM_PACKAGE = (Get-Item packages/*.tgz).FullName
          $env:SCORECARD_DOTNET_PACKAGE = (Get-Item packages/*.nupkg).FullName
          $env:SCORECARD_NEW_NPM_PACKAGE = (Get-Item migration-packages/*.tgz).FullName
          $env:SCORECARD_NEW_DOTNET_PACKAGE = (Get-Item migration-packages/*.nupkg).FullName
          npm pack codemetrics-ai@0.2.0 --pack-destination packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SCORECARD_OLD_JS_PACKAGE = (Get-Item packages/codemetrics-ai-0.2.0.tgz).FullName
          node --test skills/code-scorecard/scripts/tests/brand-migration.test.mjs
          exit $LASTEXITCODE
